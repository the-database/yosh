name: build-release

on:
  push:
    tags: ['v*']        # tag a version -> build + publish a Release
  workflow_dispatch: {}  # manual run -> build artifacts only (no release)

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: target/release/yosh.exe
            asset: yosh-windows-x64.exe
            rustflags: "-C target-feature=+crt-static"
          - os: ubuntu-latest
            bin: target/release/yosh
            asset: yosh-linux-x64
            rustflags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p yosh
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Package
        shell: bash
        run: cp "${{ matrix.bin }}" "${{ matrix.asset }}"

      - name: Build portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable/yosh | Out-Null
          Copy-Item target/release/yosh.exe portable/yosh/yosh.exe
          Copy-Item crates/yosh/installer/yosh-portable.txt portable/yosh/yosh-portable.txt
          Compress-Archive -Path portable/yosh -DestinationPath yosh-windows-x64-portable.zip -Force

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v','' } else { '0.0.0' }
          Write-Host "Installer version: $ver"
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" crates/yosh/installer/yosh.iss
          Copy-Item crates/yosh/installer/Output/yosh-setup-x64.exe yosh-setup-x64.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset }}

      - name: Upload Windows installer artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: yosh-windows-installers
          path: |
            yosh-windows-x64-portable.zip
            yosh-setup-x64.exe

      - name: Attach Windows installers to release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            yosh-windows-x64-portable.zip
            yosh-setup-x64.exe
