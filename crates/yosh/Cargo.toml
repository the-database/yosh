[package]
name = "yosh"
version = "0.2.1"
edition = "2024"

[dependencies]
# The reusable decode/render core: the DecodePool, HQ decode path, page/texture/
# cache layer, source backends, layout math, and the wgpu device context. The
# page-decode crates (png/jpeg-decoder/image/jxl-oxide/psd/qcms/fast_image_resize/
# ico) and archive crates (zip/unrar/sevenz-rust2) live there, not here.
yosh-engine = { path = "../yosh-engine" }
winit = "0.30.13"
wgpu = "29.0.3"
egui = "0.34.3"
egui-wgpu = "0.34.3"
egui-winit = "0.34.3"
# Phosphor icon font for the library section carets (pure-Rust glyph set — no C
# toolchain; the same crate the Android shell uses, so the carets render
# identically and never fall back to tofu boxes).
egui-phosphor = { version = "0.12", default-features = false, features = ["fill"] }
rfd = "0.17"
# The shell still uses a few engine deps directly: `image` for the window icon,
# the info-overlay format probe, and egui cover thumbnails; `jxl-oxide` only to
# name a JXL's pixel format in that overlay (the engine does the real decode);
# `fast_image_resize` for the thumbnail Resizer; `natord` to sort library volumes.
image = "0.25"
jxl-oxide = { version = "0.12", default-features = false }
fast_image_resize = "6"
natord = "1"
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Self-update against public GitHub releases (pure-Rust TLS via rustls + ring).
ureq = "2"
self-replace = "1"
# Live folder refresh: an OS filesystem watch (ReadDirectoryChangesW / inotify /
# FSEvents) on the open folder, so images added on disk appear without reopening.
# Pure-Rust, no C toolchain.
notify = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# Embed the application icon into the .exe (build.rs). Windows-only so a plain
# `cargo build` on Linux pulls nothing extra.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
# AVIF decode via the image crate's native (dav1d) backend. OFF by default so
# the standard `cargo build` needs no C toolchain. Enabling it requires nasm +
# dav1d (or a vendored build): `cargo build --release -p yosh --features avif`.
# Forwarded to the engine, which owns the decode path (image/avif-native).
avif = ["yosh-engine/avif"]
