[package]
name = "yosh-engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "yosh_engine"

[features]
default = ["rar"]
# RAR/CBR support via the `unrar` crate (bundled UnRAR C++). ON by default. The
# UnRAR source uses `lutimes`, absent from Android's Bionic libc, so it can't
# cross-compile to Android — an Android shell builds the engine with
# `--no-default-features` to drop it (folder / CBZ / 7z still work).
rar = ["yosh-image/rar"]
# AVIF decode via the image crate's native (dav1d) backend. OFF by default so the
# standard build needs no C toolchain. The `yosh` app forwards its own `avif`
# feature to this one. Enabling requires nasm + dav1d (see CI).
avif = ["yosh-image/avif"]
# The AI-upscale add-on's runtime binding (`sr::aji`): loads libaji from the
# add-on directory at runtime via libloading (pure Rust — no C toolchain, and no
# inference runtime linked). The `Upscaler` trait and the SR lane are always
# built; without an installed add-on they stay inert.
sr = ["dep:libloading"]

[dependencies]
# The GPU-free imaging core: decoders, ICC, tone curves, HQ resize, page sources.
# default-features off so the engine's own `rar` feature decides (Android drops it).
yosh-image = { path = "../yosh-image", default-features = false }
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
# GIF/WebP animation frames, thumbnails, the info overlay's format probe.
image = "0.25"
png = "0.18"
# The info overlay names a JXL's pixel format (`meta.rs`).
jxl-oxide = { version = "0.12", default-features = false }
fast_image_resize = "6"
# ICO container parsing (multi-image .ico → layered pages) and re-encoding.
ico = "0.6"
libloading = { version = "0.8", optional = true }

[dev-dependencies]
# Hand-building zips with raw (non-UTF-8) entry names in tests needs real CRCs;
# `zip`'s writer only accepts `&str` names, so it can't produce those archives.
crc32fast = "1"
jpeg-encoder = "0.7.1"
# wgpu's stub backend (`Device::noop`), so `gesture.rs`'s tests can build a real
# `Reader` — which needs a Device/Queue — with no GPU and no windowing. Resolver 2
# keeps this feature out of every non-test build of the crate.
wgpu = { version = "30", features = ["noop"] }
