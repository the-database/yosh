[package]
name = "yosh-engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "yosh_engine"

[features]
default = ["rar"]
# RAR/CBR support via the `unrar` crate (bundled UnRAR C++). ON by default. The
# UnRAR source uses `lutimes`, absent from Android's Bionic libc, so it can't
# cross-compile to Android — an Android shell builds the engine with
# `--no-default-features` to drop it (folder / CBZ / 7z still work).
rar = ["dep:unrar"]
# AVIF decode via the image crate's native (dav1d) backend. OFF by default so the
# standard build needs no C toolchain. The `yosh` app forwards its own `avif`
# feature to this one. Enabling requires nasm + dav1d (see CI).
avif = ["image/avif-native"]

[dependencies]
wgpu = "29.0.3"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
image = "0.25"
png = "0.18"
jpeg-decoder = "0.3"
# Pure-Rust JPEG XL decoder (no C toolchain). default-features = false keeps out
# the optional lcms2 (C) / image / rayon features — color is managed via qcms and
# pages parallelize across the DecodePool, so JXL decodes single-threaded.
jxl-oxide = { version = "0.12", default-features = false }
# Pure-Rust PSD parser (renders a PSD's flattened 8-bit RGB composite).
psd = "0.3"
fast_image_resize = "6"
qcms = "0.3"
# ICO container parsing (multi-image .ico → layered pages) and re-encoding.
ico = "0.5"
natord = "1"
# Archive page sources: zip/cbz (parallel reads), rar/cbr + 7z/cb7 (sequential —
# a reader thread decompresses into an in-memory map served to readers).
zip = "8"
unrar = { version = "0.5", optional = true }
sevenz-rust2 = "0.21"
# Legacy archive-entry-name decoding (both pure Rust, no C toolchain). Zip stores
# names as raw bytes and only flags UTF-8 via general-purpose bit 11; Japanese and
# Chinese CBZs are routinely written with that flag clear and Shift-JIS/GBK bytes,
# which the zip crate renders as CP437 mojibake. `chardetng` sniffs the codepage
# (same detector Firefox uses) and `encoding_rs` decodes it. See `source::decode_entry_name`.
chardetng = "1"
encoding_rs = "0.8"

[dev-dependencies]
# Hand-building zips with raw (non-UTF-8) entry names in tests needs real CRCs;
# `zip`'s writer only accepts `&str` names, so it can't produce those archives.
crc32fast = "1"
jpeg-encoder = "0.7.1"
# wgpu's stub backend (`Device::noop`), so `gesture.rs`'s tests can build a real
# `Reader` — which needs a Device/Queue — with no GPU and no windowing. Resolver 2
# keeps this feature out of every non-test build of the crate.
wgpu = { version = "29.0.3", features = ["noop"] }
