[package]
name = "yosh-engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "yosh_engine"

[features]
# AVIF decode via the image crate's native (dav1d) backend. OFF by default so the
# standard build needs no C toolchain. The `yosh` app forwards its own `avif`
# feature to this one. Enabling requires nasm + dav1d (see CI).
avif = ["image/avif-native"]

[dependencies]
wgpu = "29.0.3"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
image = "0.25"
png = "0.18"
jpeg-decoder = "0.3"
# Pure-Rust JPEG XL decoder (no C toolchain). default-features = false keeps out
# the optional lcms2 (C) / image / rayon features — color is managed via qcms and
# pages parallelize across the DecodePool, so JXL decodes single-threaded.
jxl-oxide = { version = "0.12", default-features = false }
# Pure-Rust PSD parser (renders a PSD's flattened 8-bit RGB composite).
psd = "0.3"
fast_image_resize = "6"
qcms = "0.3"
# ICO container parsing (multi-image .ico → layered pages) and re-encoding.
ico = "0.5"
natord = "1"
# Archive page sources: zip/cbz (parallel reads), rar/cbr + 7z/cb7 (sequential —
# a reader thread decompresses into an in-memory map served to readers).
zip = "8"
unrar = "0.5"
sevenz-rust2 = "0.21"
