[package]
name = "yosh-android"
version = "0.1.0"
edition = "2024"

[lib]
name = "yosh_android"
# Android loads the app as a shared library; android-activity calls `android_main`.
crate-type = ["cdylib"]

[features]
# RAR/CBR support, OFF by default. UnRAR's bundled C++ only cross-compiles to
# Android from a *Linux* host: on Windows its build.rs pulls in Windows-only
# sources (isnt.cpp), and it needs `-DUNIX_TIME_NS` to avoid `lutimes` (absent
# from Bionic). So local/Windows builds omit it and the CI ubuntu job turns it on
# (see crates/yosh-android/build-apk.sh + .github/workflows/release.yml).
# Forwarded through the shared shell to the engine's own `rar` feature.
rar = ["yosh-mobile/rar"]

# The glue is Android-only (the shell itself is `crates/yosh-mobile`, the desktop
# shell is `crates/yosh`). Keeping the deps under a target gate means a host
# `cargo build` over the workspace compiles this crate to an empty cdylib
# instantly, with no winit/wgpu/engine pulled in.
[target.'cfg(target_os = "android")'.dependencies]
# The shared mobile shell: frame loop, library, egui chrome, persistence.
yosh-mobile = { path = "../yosh-mobile" }
# RAR is dropped on Android unless `rar` is on (its bundled C++ won't
# cross-compile from Windows); folder / CBZ / 7z page sources remain.
yosh-engine = { path = "../yosh-engine", default-features = false }
winit = { version = "0.30.13", features = ["android-native-activity"] }
android_logger = "0.15"
log = "0.4"
# JNI to the Java SAF bridge (YoshActivity): launch the picker + read the FD.
jni = "0.22"
