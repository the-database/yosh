[package]
name = "yosh-android"
version = "0.1.0"
edition = "2024"

[lib]
name = "yosh_android"
# Android loads the app as a shared library; android-activity calls `android_main`.
crate-type = ["cdylib"]

[features]
# RAR/CBR support, OFF by default. UnRAR's bundled C++ only cross-compiles to
# Android from a *Linux* host: on Windows its build.rs pulls in Windows-only
# sources (isnt.cpp), and it needs `-DUNIX_TIME_NS` to avoid `lutimes` (absent
# from Bionic). So local/Windows builds omit it and the CI ubuntu job turns it on
# (see crates/yosh-android/build-apk.sh + .github/workflows/release.yml).
# Forwarded to the engine's own `rar` feature.
rar = ["yosh-engine/rar"]

# The shell is Android-only (the desktop shell is `crates/yosh`). Keeping the deps
# under a target gate means a host `cargo build` over the workspace compiles this
# crate to an empty cdylib instantly, with no winit/wgpu/engine pulled in.
[target.'cfg(target_os = "android")'.dependencies]
# RAR is dropped on Android (its bundled C++ won't cross-compile); folder / CBZ /
# 7z page sources remain.
yosh-engine = { path = "../yosh-engine", default-features = false }
wgpu = "29.0.3"
winit = { version = "0.30.13", features = ["android-native-activity"] }
android_logger = "0.14"
log = "0.4"
# JNI to the Java SAF bridge (YoshActivity): launch the picker + read the FD.
jni = "0.21"
# egui chrome (seekbar / library). Match the desktop's 0.34.3. egui-winit's
# default features pull arboard (clipboard) + webbrowser (links) + X11/Wayland —
# none apply on Android, so disable them.
egui = "0.34.3"
egui-wgpu = "0.34.3"
egui-winit = { version = "0.34.3", default-features = false }
# Phosphor icon font for the seekbar buttons. Pure-Rust (embeds a TTF, no C deps).
# Use the solid `fill` weight (chunky, PerfectViewer-style) only — not the default
# thin `regular`. Installed as a Proportional-family fallback (see lib.rs font setup)
# so icon glyphs render in normal labels/buttons.
egui-phosphor = { version = "0.12", default-features = false, features = ["fill"] }
# Natural-order sort for the library (vol 2 before vol 10).
natord = "1"
# Resizer for the engine's decode_and_downscale (library cover thumbnails).
fast_image_resize = "6"
